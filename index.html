<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b57d0">

<title>WIP Scanner</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#17202a;
}

header{
background:#0b57d0;
color:white;
padding:18px;
font-size:24px;
font-weight:700;
text-align:center;
}

main{
max-width:620px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:14px;
padding:16px;
margin-bottom:14px;
box-shadow:0 2px 8px #0001;
}

label{
display:block;
font-weight:700;
margin:10px 0 6px;
}

input,
button{
width:100%;
min-height:50px;
border:1px solid #bbb;
border-radius:9px;
padding:12px;
font-size:17px;
}

button{
background:#0b57d0;
color:white;
border:0;
font-weight:700;
margin-top:10px;
}

button.secondary{
background:#5f6368;
}

button:disabled{
opacity:.6;
}

#video{
width:100%;
background:#111;
border-radius:12px;
display:none;
margin-top:12px;
}

#mensaje{
margin-top:15px;
font-weight:700;
text-align:center;
}

.ok{
color:#188038;
}

.error{
color:#d93025;
}

</style>

</head>


<body>

<header>
📦 WIP SCANNER
</header>


<main>


<div class="card">

<button
id="btnEscanear"
onclick="iniciarCamara()">

📷 ESCANEAR CÓDIGO

</button>


<video
id="video"
autoplay
playsinline>
</video>


<button
id="btnDetener"
class="secondary"
onclick="detenerCamara()"
style="display:none">

⏹ DETENER CÁMARA

</button>

</div>


<div class="card">

<label>Código</label>

<input
id="codigo"
type="text"
placeholder="Código de materia prima">


<label>Material</label>

<input
id="material"
type="text"
placeholder="Ej: PP EP300H">


<label>Cantidad</label>

<input
id="cantidad"
type="number"
placeholder="Cantidad">


<label>Lote</label>

<input
id="lote"
type="text"
placeholder="Lote">


<label>Ubicación</label>

<input
id="ubicacion"
type="text"
value="WIP">


<button
id="btnTransferir"
onclick="transferir()">

TRANSFERIR A WIP

</button>


<div id="mensaje"></div>

</div>


</main>


<script>

/*
=================================================
URL DE TU WEB APP DE GOOGLE APPS SCRIPT
=================================================
*/

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbx8H4SfjGCVA8m3AtDt9lWok8iYldnEl9KCh3eAkQr4AY9-L7o6m9KwbYgh2tp8MKowQg/exec";


let stream = null;

let detector = null;

let escaneando = false;


/*
=================================================
INICIAR CÁMARA
=================================================
*/

async function iniciarCamara(){

const video =
document.getElementById("video");

const mensaje =
document.getElementById("mensaje");

try{

stream = await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});


video.srcObject = stream;

video.style.display = "block";

document.getElementById("btnEscanear").style.display =
"none";

document.getElementById("btnDetener").style.display =
"block";


/*
Intentamos utilizar BarcodeDetector
*/

if("BarcodeDetector" in window){

detector = new BarcodeDetector({

formats:[

"code_128",
"code_39",
"ean_13",
"ean_8",
"upc_a",
"upc_e",
"itf",
"codabar",
"qr_code"

]

});

escaneando = true;

buscarCodigo();

}else{

mensaje.innerHTML =
"⚠️ Tu navegador no tiene lector de código incorporado. Puedes ingresar el código manualmente.";

}

}catch(error){

mensaje.className="error";

mensaje.innerHTML =
"❌ No se pudo abrir la cámara: " + error.message;

}

}


/*
=================================================
BUSCAR CÓDIGO
=================================================
*/

async function buscarCodigo(){

if(!escaneando || !detector){

return;

}

const video =
document.getElementById("video");

try{

const codigos =
await detector.detect(video);

if(codigos.length > 0){

const codigoLeido =
codigos[0].rawValue;

document.getElementById("codigo").value =
codigoLeido;

document.getElementById("mensaje").className =
"ok";

document.getElementById("mensaje").innerHTML =
"✅ Código leído: " + codigoLeido;

detenerCamara();

return;

}

}catch(error){

// Continuar buscando

}


requestAnimationFrame(buscarCodigo);

}


/*
=================================================
DETENER CÁMARA
=================================================
*/

function detenerCamara(){

escaneando = false;

if(stream){

stream.getTracks().forEach(function(track){

track.stop();

});

stream = null;

}

const video =
document.getElementById("video");

video.srcObject = null;

video.style.display = "none";


document.getElementById("btnEscanear").style.display =
"block";

document.getElementById("btnDetener").style.display =
"none";

}


/*
=================================================
TRANSFERIR A WIP
=================================================
*/

async function transferir(){

const codigo =
document.getElementById("codigo").value.trim();

const material =
document.getElementById("material").value.trim();

const cantidad =
document.getElementById("cantidad").value;

const lote =
document.getElementById("lote").value.trim();

const ubicacion =
document.getElementById("ubicacion").value.trim();

const mensaje =
document.getElementById("mensaje");

const boton =
document.getElementById("btnTransferir");


if(!codigo){

mensaje.className="error";

mensaje.innerHTML =
"⚠️ Escanea o ingresa el código";

return;

}


if(!cantidad){

mensaje.className="error";

mensaje.innerHTML =
"⚠️ Ingresa la cantidad";

return;

}


const datos = {

codigo:codigo,

material:material,

cantidad:cantidad,

lote:lote,

ubicacion:ubicacion,

movimiento:"TRANSFERENCIA_A_WIP"

};


boton.disabled=true;

mensaje.className="";

mensaje.innerHTML =
"⏳ Registrando movimiento...";


try{

/*
Enviamos los datos a Apps Script.
*/

await fetch(URL_APPS_SCRIPT,{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify(datos)

});


/*
El modo no-cors no permite leer la respuesta,
pero el POST sí se envía al Web App.
*/

mensaje.className="ok";

mensaje.innerHTML =
"✅ MOVIMIENTO REGISTRADO";


document.getElementById("codigo").value="";

document.getElementById("material").value="";

document.getElementById("cantidad").value="";

document.getElementById("lote").value="";


}catch(error){

mensaje.className="error";

mensaje.innerHTML =
"❌ Error al enviar: " + error.message;

}


boton.disabled=false;

}

</script>

</body>

</html>
