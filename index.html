<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b57d0">

<title>WIP Scanner</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#17202a;
}

header{
background:#0b57d0;
color:white;
padding:18px;
font-size:24px;
font-weight:700;
text-align:center;
}

main{
max-width:620px;
margin:auto;
padding:15px;
}

.card{
background:white;
border-radius:14px;
padding:16px;
margin-bottom:14px;
box-shadow:0 2px 8px #0001;
}

label{
display:block;
font-weight:700;
margin:10px 0 6px;
}

input,button{
width:100%;
min-height:50px;
border:1px solid #bbb;
border-radius:9px;
padding:12px;
font-size:17px;
}

button{
background:#0b57d0;
color:white;
border:0;
font-weight:700;
margin-top:10px;
}

button.secondary{
background:#5f6368;
}

button:disabled{
opacity:.6;
}

#video{
width:100%;
background:#111;
border-radius:12px;
display:none;
margin-top:12px;
}

#mensaje{
margin-top:15px;
font-weight:700;
text-align:center;
}

.ok{
color:#188038;
}

.error{
color:#d93025;
}

.material-ok{
background:#e8f5e9;
border:2px solid #34a853;
padding:12px;
border-radius:9px;
margin-top:10px;
font-weight:bold;
}

.material-error{
background:#fce8e6;
border:2px solid #d93025;
padding:12px;
border-radius:9px;
margin-top:10px;
font-weight:bold;
}

</style>

</head>


<body>

<header>
📦 WIP SCANNER
</header>


<main>

<div class="card">

<button
id="btnEscanear"
onclick="iniciarCamara()">

📷 ESCANEAR CÓDIGO

</button>

<video
id="video"
autoplay
playsinline>
</video>

<button
id="btnDetener"
class="secondary"
onclick="detenerCamara()"
style="display:none">

⏹ DETENER CÁMARA

</button>

</div>


<div class="card">

<label>Código</label>

<input
id="codigo"
type="text"
placeholder="Código de materia prima"
readonly>


<label>Material</label>

<input
id="material"
type="text"
placeholder="Se completa automáticamente"
readonly>


<div id="resultadoMaterial"></div>


<label>Cantidad (kg)</label>

<input
id="cantidad"
type="number"
step="0.01"
placeholder="Ingrese los kg">


<label>Lote</label>

<input
id="lote"
type="text"
placeholder="Lote">


<label>Destino</label>

<select
id="ubicacion"
style="width:100%;min-height:50px;border:1px solid #bbb;border-radius:9px;padding:12px;font-size:17px;">

<option value="WIP EXTRUSION">WIP EXTRUSIÓN</option>

<option value="WIP INYECCION">WIP INYECCIÓN</option>

</select>


<button
id="btnTransferir"
onclick="transferir()">

TRANSFERIR A WIP

</button>


<div id="mensaje"></div>

</div>

</main>


<script>

/*
====================================================
WEB APP DE GOOGLE APPS SCRIPT
====================================================
*/

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbx8H4SfjGCVA8m3AtDt9lWok8iYldnEl9KCh3eAkQr4AY9-L7o6m9KwbYgh2tp8MKowQg/exec";


/*
====================================================
MATERIAS PRIMAS
====================================================
*/

const MATERIALES = {

  "MNAPP":
  "MASTER",

  "S1100":
  "PC",

  "ABS FR11":
  "ABS BLANCO",

  "HYS6200":
  "PP EXTRUSION HOMO PETROCUYO",

  "EP300H":
  "PP EXTRUSION COPO LYONDELL",

  "CP741":
  "PP EXTRUSION COPO BRASKEM",

  "CP241":
  "PP INYECCION COPO BRASKEM",

  "5003GR80-":
  "PC GRIS - FLUIDEZ ARGENTINO",

  "5003GR80+":
  "PC GRIS + FLUIDEZ ARGENTINO",

  "5000 CR00":
  "PC TRANSPARENTE ARGENTINO"

};
 

/*
====================================================
VARIABLES DE CÁMARA
====================================================
*/

let stream = null;

let detector = null;

let escaneando = false;


/*
====================================================
INICIAR CÁMARA
====================================================
*/

async function iniciarCamara(){

const video =
document.getElementById("video");

const mensaje =
document.getElementById("mensaje");

try{

stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
}
},

audio:false

});


video.srcObject =
stream;

video.style.display =
"block";


document.getElementById("btnEscanear")
.style.display="none";


document.getElementById("btnDetener")
.style.display="block";


/*
Detector de códigos
*/

if("BarcodeDetector" in window){

detector =
new BarcodeDetector({

formats:[

"code_128",
"code_39",
"ean_13",
"ean_8",
"upc_a",
"upc_e",
"itf",
"codabar"

]

});

escaneando=true;

buscarCodigo();

}else{

mensaje.className="error";

mensaje.innerHTML=
"⚠️ El navegador no permite lectura automática.";

}

}catch(error){

mensaje.className="error";

mensaje.innerHTML=
"❌ No se pudo abrir la cámara: "
+ error.message;

}

}


/*
====================================================
BUSCAR CÓDIGO
====================================================
*/

async function buscarCodigo(){

if(!escaneando || !detector){

return;

}

const video =
document.getElementById("video");


try{

const codigos =
await detector.detect(video);


if(codigos.length>0){

const codigoLeido =
codigos[0].rawValue.trim();


procesarCodigo(codigoLeido);

detenerCamara();

return;

}

}catch(error){

}


requestAnimationFrame(buscarCodigo);

}


/*
====================================================
PROCESAR CÓDIGO
====================================================
*/

function procesarCodigo(codigo){

const codigoNormalizado =
codigo.trim().toUpperCase();


let material = MATERIALES[codigoNormalizado];

if (codigoNormalizado === "5003GR80+") {
  material = "PC GRIS + FLUIDEZ ARGENTINO";
}

if (codigoNormalizado === "5003GR80-") {
  material = "PC GRIS - FLUIDEZ ARGENTINO";
}


const campoCodigo =
document.getElementById("codigo");

const campoMaterial =
document.getElementById("material");

const resultado =
document.getElementById("resultadoMaterial");

const mensaje =
document.getElementById("mensaje");


/*
Mostrar código
*/

campoCodigo.value =
codigoNormalizado;


/*
Buscar descripción
*/

if(material){

campoMaterial.value =
material;


resultado.className =
"material-ok";


resultado.innerHTML =
"✅ MATERIAL IDENTIFICADO<br>" +
material;


mensaje.className="ok";

mensaje.innerHTML =
"✅ Código leído correctamente";


}else{

campoMaterial.value="";


resultado.className =
"material-error";


resultado.innerHTML =
"⚠️ CÓDIGO NO REGISTRADO<br>" +
codigoNormalizado;


mensaje.className="error";

mensaje.innerHTML =
"⚠️ Esta materia prima no está registrada";

}

}


/*
====================================================
DETENER CÁMARA
====================================================
*/

function detenerCamara(){

escaneando=false;


if(stream){

stream.getTracks().forEach(
function(track){

track.stop();

});

stream=null;

}


const video =
document.getElementById("video");

video.srcObject=null;

video.style.display="none";


document.getElementById("btnEscanear")
.style.display="block";


document.getElementById("btnDetener")
.style.display="none";

}


/*
====================================================
TRANSFERIR A WIP
====================================================
*/

async function transferir(){

const codigo =
document.getElementById("codigo")
.value.trim();


const material =
document.getElementById("material")
.value.trim();


const cantidad =
document.getElementById("cantidad")
.value;


const lote =
document.getElementById("lote")
.value.trim();


const ubicacion =
document.getElementById("ubicacion")
.value;


const mensaje =
document.getElementById("mensaje");


const boton =
document.getElementById("btnTransferir");


/*
Validaciones
*/

if(!codigo){

mensaje.className="error";

mensaje.innerHTML =
"⚠️ Primero escanee la materia prima";

return;

}


if(!material){

mensaje.className="error";

mensaje.innerHTML =
"⚠️ Código de materia prima no registrado";

return;

}


if(!cantidad || Number(cantidad)<=0){

mensaje.className="error";

mensaje.innerHTML =
"⚠️ Ingrese la cantidad en kg";

return;

}


/*
Datos a enviar
*/

const datos={

codigo:codigo,

material:material,

cantidad:cantidad,

lote:lote,

ubicacion:ubicacion,

movimiento:"TRANSFERENCIA_A_WIP"

};


boton.disabled=true;


mensaje.className="";

mensaje.innerHTML =
"⏳ Registrando movimiento...";


try{

await fetch(

URL_APPS_SCRIPT,

{

method:"POST",

mode:"no-cors",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:
JSON.stringify(datos)

});


/*
Movimiento enviado
*/

mensaje.className="ok";

mensaje.innerHTML =
"✅ MOVIMIENTO REGISTRADO";


/*
Limpiar formulario
*/

document.getElementById("codigo")
.value="";

document.getElementById("material")
.value="";

document.getElementById("cantidad")
.value="";

document.getElementById("lote")
.value="";

document.getElementById("resultadoMaterial")
.innerHTML="";


}catch(error){

mensaje.className="error";

mensaje.innerHTML =
"❌ ERROR AL ENVIAR: "
+error.message;

}


boton.disabled=false;

}

</script>

</body>

</html>
